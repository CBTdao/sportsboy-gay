name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Python syntax
        run: python -m compileall -q api tools

      - name: Config JSON validity
        run: |
          python -m json.tool vercel.json > /dev/null
          python -m json.tool manifest.json > /dev/null
          python -m json.tool assets/data/concentration.json > /dev/null

      - name: sitemap is regenerated and deduplicated
        run: python tools/gen_sitemap.py --check

      - name: No broken internal links
        run: python tools/check_links.py

      - name: Content red-line (no internal jargon on public pages)
        run: bash tools/check_redline.sh $(find . -name '*.html' -not -path './.git/*')

      - name: API routes in vercel.json map to real serverless files
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          cfg = json.loads(pathlib.Path("vercel.json").read_text(encoding="utf-8"))
          routes = set(re.findall(r"/api/[A-Za-z0-9_-]+", json.dumps(cfg)))
          missing = sorted(r for r in routes
                           if not (pathlib.Path("api") / (r.rsplit("/", 1)[1] + ".py")).is_file())
          if missing:
              sys.exit("API routes without a matching serverless file: " + ", ".join(missing))
          print("OK: API routes:", ", ".join(sorted(routes)))
          PY
